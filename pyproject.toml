[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "theia"
version = "0.1.0"
description = "Real-time video outlier detection — streams video, analyses scenes with VLMs, flags anomalous behaviour."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Jonathan McHale" }]
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "structlog>=24.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
]
storage = [
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
theia = "theia.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/theia"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
